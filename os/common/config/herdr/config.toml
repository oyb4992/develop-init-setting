[keys]
detach = "prefix+d"
reload_config = "prefix+r"

split_vertical = "prefix+|"
resize_mode = "prefix+shift+r"

# Prefix+Tab을 yazi에 양보
cycle_pane_next = ""

[[keys.command]]
key = "prefix+tab"
type = "popup"
command = "yazi"
width = "50%"
height = "90%"

[[keys.command]]
key = "prefix+b"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement split --direction right --focus'
description = "open browser in right split"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

#herdr-file-viewer 플러그인 설정
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

# herdr-plus Projects
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "Projects"

# herdr-plus Quick Actions
[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "Quick Actions"

# LazyGit sidebar
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "Lazygit"

# LazyGit tab
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
description = "Lazygit Tab"

# Reviewr
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Code Review"

[ui]
mouse_scroll_lines = 5
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    "terminal_title_stripped",
  ],
  [
    "agent",
  ],
]

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = true
